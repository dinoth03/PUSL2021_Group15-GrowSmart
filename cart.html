<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrowSmart - Cart</title>
    <link rel="icon" type="image/png" href="Img/TitleLogo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/cart.css" rel="stylesheet" />
  </head>

  <body>
    <br /><br />
    <div class="section-1">
      <div>
        <h2 class="mt-4">Your Cart</h2>
      </div>
      <div class="container">
        <div
          style="
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 10px;
          "
        >
          <label style="margin-right: 30px; font-size: 20px">
            <input type="checkbox" id="selectAll" /> Select All
          </label>
          <button id="removeAll" class="btn btn-remove">Remove Selected</button>
        </div>
        <br />
        <div
          id="cartItems"
          style="
            border: 1px solid #ddd;
            padding: 15px;
            margin: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
          "
        ></div>

        <h3>Total: <span id="totalPrice">Rs.0.00</span></h3>
        <button id="checkout" type="button" class="btn btn-checkout">
          Check Out
        </button>
        <button
          class="btn btn-back"
          type="button"
          onclick="window.location.href='shop.php';"
        >
          Back
        </button>
        <br /><br />
      </div>
    </div>

    <!-- ✅ Add the hidden checkout form here -->
<form id="checkoutForm" action="controller/checkoutProcess.php" method="POST" style="display: none;">
  <input type="hidden" name="checkout_items" id="checkoutItemsInput">
  <input type="hidden" name="checkout_total" id="checkoutTotalInput">
</form>

    <script src="js/cart.js"></script>
  </body>
</html>
