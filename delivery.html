<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowSmart - Delivery Details</title>
    <link rel="icon" type="image/png" href="Img/TitleLogo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .mt-4 {
  background: #fff;
  box-shadow: --box-shadow;
  padding: 1rem 1rem;
  text-align: center;
  outline: var(--outline);
  outline-offset: -0.5rem;
    background-color: #fff;
    border: 1px solid white;
    width: 100%;
    padding: 10px 0px 10px 0px;
    border: 20px solid #ddd;
  }

  .btn {
  background: #d5f3d5;
  border: 0.1rem solid #00ff00;
  align-content: center;
}
.btn:hover {
  background: #00ff00;
  color: white;
}

.container
{
    background-color:rgb(252, 252, 250);
    border: 5px solid #00ff00;
}

    </style>
</head>

<body>
    <br>
    <br>

    <div class="container">
        <h2 class="mt-4">Delivery Details</h2>
        <form id="deliveryForm" action="controller/deliveryDetails.php" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea name="address" class="form-control" id="address" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" id="phone" required>
            </div>
        
            <input type="hidden" id="totalInput" name="total">
            <h3>Total: <span id="totalPrice"></span></h3>
        
            <div class="text-center mt-3">
                <button type="submit" class="btn">Confirm Order</button>
                <br>
                <br>
              </div>
              
        </form>
        
    </div>

    <script>

document.addEventListener("DOMContentLoaded", function () {
    const totalElement = document.getElementById("totalPrice");
    const totalInput = document.getElementById("totalInput");
    const deliveryForm = document.getElementById("deliveryForm");

    // Get the total price from URL (e.g., ?total=Rs.500)
    const urlParams = new URLSearchParams(window.location.search);
    const total = urlParams.get("total") || "Rs.0.00";

    // Display and store in hidden input
    totalElement.textContent = total;
    totalInput.value = total;

    // Handle form submission
    deliveryForm.addEventListener("submit", function (e) {
        // Allow form to submit normally to PHP
        if (!document.getElementById("name").value.trim() ||
            !document.getElementById("address").value.trim() ||
            !document.getElementById("phone").value.trim()) {
            e.preventDefault();
            alert("Please fill in all fields.");
        }
    });
});
</script>
</body>

</html>
