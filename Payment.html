<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Payment</title>
    <link rel="icon" type="image/png" href="Img/TitleLogo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Payment.css">
</head>

<body>



  <div class="container">
    <form action="payment.php" method="POST" id="cardForm">
  
      <div class="payment-container">
        
        <!-- Purchase Summary Section -->
        <div class="section" style="flex: 1;">
          <h3>Purchase Summary</h3>
          <hr>
          <div class="receipt">
            <p id="product"><b>Products:</b></p>
            <p class="total" id="total_price"><b>Total Price:</b></p>
            <input type="hidden" name="product" value="Plant Package">
            <input type="hidden" name="amount" value="36">
          </div>
        </div>
  
        <!-- Payment Method Section -->
        <div class="section" style="flex: 2;">
          <h3>Payment Method</h3>
          <hr>
  
          <!-- PayPal Button Container -->
          <div id="paypal-button-container" style="margin-bottom: 20px;"></div>
  
          <!-- Card Form Fields -->
          <div class="card-form">
            <input type="text" id="cd" name="card_number" placeholder="Card Number" required>
            <input type="text" id="ex" name="expiry" placeholder="Expiration (MM/YY)" required>
            <input type="text" id="cvv" name="cvv" placeholder="CVV" required>
            <input type="text" id="fname" name="first_name" placeholder="First Name" required>
            <input type="text" id="lname" name="last_name" placeholder="Last Name" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
          </div>
  
          <!-- Terms Checkbox -->
          <div class="checkbox">
            <input type="checkbox" id="check1" required>
            <label for="check1">I agree to the <a href="Terms and Conditions.html" id="tnm">Terms & Conditions</a></label>
          </div>
  
          <!-- Action Buttons -->
          <div class="buttons">
            <a href="home new.html" class="back-btn" id="back">BACK</a>
            <button type="submit" class="pay-now-btn" id="pay">PAY NOW</button>
          </div>
  
        </div> <!-- End of Payment Method Section -->
  
      </div> <!-- End of payment-container -->
  
    </form>
  </div>


         <!-- PayPal Sandbox Configuration Load -->
	      	<!-- Include the PayPal JavaScript SDK -->
   			 <script src="https://www.paypal.com/sdk/js?client-id=AS8svvryxGm8WdNhTp-2NZJcHdVJvTfTEfQB6w7yij6sfRCsHd-6pBiHe61dv7UrQ_x04bcaZ-j_OkBo&currency=USD"></script>
                <!-- This is ABCCinemas App under ABCCinemas Sandbox Account -->
                <!-- Username & Password for the sandbox account of the site -->
                <!-- Email :- CinemasABC@gmail.com  /  Password :- ABC@cinemas -->
    <script>
      // Render the PayPal button into #paypal-button-container
      paypal.Buttons({
          style: {
              layout: 'horizontal'
          },
          createOrder: function(data, actions) {
              return actions.order.create({
                  purchase_units: [{
                      amount: {
                          value: '36' // Total price dynamically passed
                      }
                  }]
              });
          },
          onApprove: function(data, actions) {
              return actions.order.capture().then(function(details) {
                  alert('Transaction completed by ' + details.payer.name.given_name + '!');
              });
          }
      }).render('#paypal-button-container');
    </script>


</body>
</html>
